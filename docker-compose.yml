services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pirry-app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./.env:/var/www/html/.env:ro
      - pirry_storage:/var/www/html/storage
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: usuarios
      DB_USERNAME: pirry_app
      DB_PASSWORD: pirry_docker_app_local
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.4.32
    container_name: pirry-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: pirry_docker_root_local
      MARIADB_DATABASE: usuarios
      MARIADB_USER: pirry_app
      MARIADB_PASSWORD: pirry_docker_app_local
    volumes:
      - pirry_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$${MARIADB_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pirry_db_data:
  pirry_storage:
